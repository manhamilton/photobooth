<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photobooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <h1>AI Photobooth</h1>

  <div class="preview">

    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas"></canvas>

    <img src="frames/frame.png" id="frame" class="frame" alt="Frame">

    <div id="countdown"></div>

  </div>

  <button id="start">📷 Buka Kamera</button>

  <label class="uploadBtn">
    🖼 Upload dari Galeri
    <input type="file" id="galleryUpload" accept="image/*" hidden>
  </label>

  <button id="shoot">📸 Take Photo</button>

</div>

<script src="script.js"></script>

</body>
</html>
